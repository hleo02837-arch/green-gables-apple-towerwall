<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03110c" />
  <title>Queen Jesse Swagata // ECHO-AMEN-7777 • Belleville, ON</title>
  <style>
    :root {
      --bg-void: #020c08;
      --bg-card: #04150e;
      --bg-input: #071f15;
      --border-dim: #134632;
      --border-green: #22c55e;
      --border-gold: #eab308;
      --text-main: #d8f8e8;
      --text-muted: #78b898;
      --accent-green: #22ff88;
      --accent-gold: #facc15;
      --accent-amber: #d99b1e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-void);
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 12px 10px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: linear-gradient(180deg, rgba(6, 26, 18, 0.96), rgba(3, 15, 10, 0.98));
      border: 1px solid var(--border-dim);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .tag-green {
      color: var(--accent-green);
      background: rgba(34, 255, 136, 0.08);
      border: 1px solid rgba(34, 255, 136, 0.35);
      border-radius: 8px;
      padding: 4px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag-gold {
      color: var(--accent-gold);
      background: rgba(250, 204, 21, 0.08);
      border: 1px solid rgba(234, 179, 8, 0.45);
      border-radius: 8px;
      padding: 4px 8px;
      white-space: nowrap;
    }

    .stage-box {
      position: relative;
      width: 100%;
      height: 230px;
      border-radius: 12px;
      overflow: hidden;
      background: #020d08;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .stage-badge-wrap {
      position: absolute;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .stage-badge {
      color: var(--accent-gold);
      background: rgba(4, 18, 12, 0.92);
      border: 1px solid var(--border-gold);
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .stage-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      font-size: 10px;
      font-weight: 700;
    }

    .pill-status {
      color: var(--accent-green);
      background: rgba(7, 36, 23, 0.95);
      border: 1px solid rgba(34, 255, 136, 0.4);
      border-radius: 8px;
      padding: 5px 9px;
      white-space: nowrap;
    }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .sec-title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text-main);
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid var(--border-green);
      background: rgba(16, 185, 129, 0.14);
      color: var(--accent-green);
    }

    .toggle-pill.off {
      border-color: var(--border-dim);
      background: rgba(7, 25, 17, 0.8);
      color: var(--text-muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .band-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .band-label {
      color: var(--accent-green);
    }

    .lvl-label {
      color: var(--accent-gold);
    }

    .meter-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #03110b;
      border: 1px solid var(--border-dim);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .meter-fill {
      height: 100%;
      width: 55%;
      background: linear-gradient(90deg, #16a34a 0%, #22ff88 55%, #facc15 100%);
      transition: width 160ms ease;
    }

    .btn-ghost-gold {
      background: rgba(250, 204, 21, 0.08);
      border: 1px solid rgba(234, 179, 8, 0.55);
      color: var(--accent-gold);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-transform: uppercase;
    }

    .note-line {
      margin: 8px 0 12px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .ch-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .ch-tile {
      text-align: left;
      background: rgba(5, 22, 15, 0.92);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 9px 11px;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .ch-tile.active {
      border-color: var(--border-gold);
      background: rgba(24, 34, 12, 0.92);
    }

    .ch-code {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .ch-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      outline: none;
      margin-bottom: 8px;
    }

    .field:focus {
      border-color: var(--border-green);
    }

    .field::placeholder {
      color: #5c967a;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-gold {
      background: linear-gradient(180deg, #facc15, #d99b1e);
      color: #06130c;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-outline-green {
      background: rgba(16, 185, 129, 0.08);
      color: var(--accent-green);
      border: 1px solid rgba(34, 255, 136, 0.55);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .pair-id-line {
      margin: 10px 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      word-break: break-all;
    }

    .log-box {
      background: #020d08;
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      padding: 14px 10px;
      min-height: 140px;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .log-empty {
      margin: auto;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .msg-item {
      background: rgba(8, 34, 22, 0.85);
      border: 1px solid rgba(34, 197, 94, 0.28);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 11px;
    }

    .msg-meta {
      color: var(--accent-gold);
      font-size: 10px;
      margin-bottom: 3px;
    }

    .msg-body {
      color: var(--text-main);
      word-break: break-word;
    }

    .send-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .send-row .field {
      margin-bottom: 0;
      flex: 1;
      min-width: 0;
    }

    .btn-send {
      background: linear-gradient(180deg, #facc15, #d99b1e);
      color: #06130c;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- Top Visual Stage -->
    <section class="card">
      <div class="topbar">
        <span class="tag-green" id="top-title">QUEEN JESSE SWAGATA • ECHO-AMEN-7777</span>
        <span class="tag-gold">BELLEVILLE, ON</span>
      </div>

      <div class="stage-box">
        <canvas id="orb-canvas"></canvas>
        <div class="stage-badge-wrap">
          <div class="stage-badge" id="stage-badge">QUEEN JESSE SWAGATA • ZERO TRUST</div>
        </div>
      </div>

      <div class="stage-footer">
        <span class="pill-status" id="cipher-pill">CIPHER: AES-256-GCM (READY)</span>
        <span class="pill-status" id="sweep-pill">SWEEP: 000°</span>
      </div>
    </section>

    <!-- Voice / CB Audio & 4 Channels -->
    <section class="card">
      <div class="sec-head">
        <h2 class="sec-title">VOICE / CB AUDIO (0.3–3.4 kHz)</h2>
        <button type="button" id="audio-toggle" class="toggle-pill" onclick="toggleAudio()">
          <span id="audio-toggle-text">ON</span>
          <span class="dot"></span>
        </button>
